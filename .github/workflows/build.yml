name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.5
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q Godot_v4.5-stable_linux.x86_64.zip
          mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          unzip -q Godot_v4.5-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.5.stable/

      - name: Write firebase.env
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: |
          printf '%s' "$FIREBASE_ENV" > godot/addons/godot-firebase/.env
          echo "--- .env contents (databaseURL line only) ---"
          grep databaseURL godot/addons/godot-firebase/.env

      - name: Export Windows build
        run: |
          mkdir -p build
          cd godot
          godot --headless --export-release "Windows Desktop" ../build/TBT.exe

      - name: Write version file
        run: echo "${{ github.ref_name }}" > build/version.txt

      - name: Zip build
        run: |
          cd build
          zip -r ../TBT.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TBT.zip
          generate_release_notes: false
